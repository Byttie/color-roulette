name: Push to EC2

on:
  push:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
     - name: git clone
       uses: actions/checkout@v4
  Deploy:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: SSH into EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_IP}}
          username: "ubuntu"
          key: ${{secrets.EC2_SSH_KEY}}
          port: 22
          script: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y nodejs npm git
            sudo npm install -g pm2
            if [ ! -d ~/color-app ]; then git clone https://github.com/Byttie/color-roulette.git ~/color-app; fi
            cd ~/color-app
            git pull origin main
            npm install --omit=dev
            pm2 restart color-app || pm2 start server.js --name color-app